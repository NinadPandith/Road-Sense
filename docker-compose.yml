# One-command local setup (PRD, non-functional requirements: reproducibility).
#
#   docker compose up --build
#
# Then open http://localhost:5173 (app) and http://localhost:8000/docs (API).
# Local Postgres + PostGIS replaces Supabase; photos are stored in backend/.local_storage.
# Set HF_MODEL_REPO (or put the .onnx files in backend/models/) so reports can be scored.
# Engineer sign-in needs a Supabase project: set VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
# and SUPABASE_JWT_SECRET (see docs/deployment.md). The citizen flow works without it.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadsense
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The parts of Supabase the migrations expect (auth schema, roles), local only.
      - ./backend/scripts/supabase_shim.sql:/docker-entrypoint-initdb.d/00-supabase-shim.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadsense"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/roadsense
      ALLOWED_ORIGINS: http://localhost:5173
      PUBLIC_API_URL: http://localhost:8000
      HF_MODEL_REPO: ${HF_MODEL_REPO:-}
      MODEL_VERSION: ${MODEL_VERSION:-local}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SURVEY_WORKER_ENABLED: "true"
      OSM_LOOKUP_ENABLED: "true"
    volumes:
      - ./data:/data:ro # pilot area, wards, schools/hospitals for the seed script
      - ./backend/models:/app/models:ro # optional local .onnx models
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
             uv run --no-sync python -m scripts.seed &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  frontend:
    image: node:22-slim
    working_dir: /app
    depends_on: [backend]
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --port 5173"
    ports: ["5173:5173"]

volumes:
  pgdata:
  frontend_node_modules:
