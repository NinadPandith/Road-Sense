name: Deploy backend

# Builds the API image, pushes it to GitHub Container Registry, runs database migrations, and
# updates the Azure Container App with the new image AND its settings (all keys live in GitHub's
# "production" environment, so nothing is configured by hand in Azure).
# The frontend deploys itself through Vercel's GitHub app.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # GitHub signs in to Azure with OIDC (no stored Azure password)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/roadsense-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Image name in lower case
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: HF_MODEL_REPO=${{ vars.HF_MODEL_REPO }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - uses: astral-sh/setup-uv@v5
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv sync --frozen --no-dev && uv run alembic upgrade head

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update secrets in the container app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'unused' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          IP_SALT: ${{ secrets.IP_HASH_SALT }}
        run: |
          az containerapp secret set \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --secrets database-url="$DATABASE_URL" service-key="$SERVICE_KEY" \
                      jwt-secret="$JWT_SECRET" cron-secret="$CRON_SECRET" ip-salt="$IP_SALT" \
            --output none

      - name: Update image and settings
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --set-env-vars \
              DATABASE_URL=secretref:database-url \
              SUPABASE_SERVICE_KEY=secretref:service-key \
              SUPABASE_JWT_SECRET=secretref:jwt-secret \
              CRON_SECRET=secretref:cron-secret \
              IP_HASH_SALT=secretref:ip-salt \
              SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
              PUBLIC_API_URL="${{ vars.API_URL }}" \
              ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS || 'http://localhost:5173' }}" \
              HF_MODEL_REPO="${{ vars.HF_MODEL_REPO }}" \
              MODEL_VERSION="${{ vars.MODEL_VERSION || 'none-yet' }}" \
              PILOT_AREA_NAME="${{ vars.PILOT_AREA_NAME || 'the pilot area' }}" \
            --output none

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.API_URL }}/health" && exit 0
            sleep 10
          done
          echo "::error::The API didn't answer /health. If the log says 'unauthorized' for the image, make the ghcr.io package public (see docs/deployment.md)."
          exit 1
