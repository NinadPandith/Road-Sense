[project]
name = "roadsense-backend"
version = "0.1.0"
description = "RoadSense API: detection, severity, merging and repair priority"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.17",
    "numpy>=1.26,<3",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "shapely>=2.0",
    "gpxpy>=1.6",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a Postgres + PostGIS database (TEST_DATABASE_URL)",
    "slow: model tests on real weights",
]
